<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Média</title>
  <link rel="stylesheet" href="style.css">
  <script src="calculadora.js" defer></script>
</head>
<body>
  <main class="container">
    <section class="card">
      <span class="tag">PROJETO 3</span>
      <h1>Calculadora de Média</h1>
      <p class="intro">Digite as três notas para descobrir sua média e sua situação.</p>

      <form id="form-notas">
        <label for="nota1">Primeira nota</label>
        <input id="nota1" type="number" min="0" max="10" step="0.1" placeholder="Ex.: 8,5" required>

        <label for="nota2">Segunda nota</label>
        <input id="nota2" type="number" min="0" max="10" step="0.1" placeholder="Ex.: 7,0" required>

        <label for="nota3">Terceira nota</label>
        <input id="nota3" type="number" min="0" max="10" step="0.1" placeholder="Ex.: 9,0" required>

        <button type="submit">Calcular média</button>
      </form>

      <div id="resultado" class="resultado" aria-live="polite">
        <h2>Sua média aparecerá aqui</h2>
        <p>Preencha as notas e clique em “Calcular média”.</p>
      </div>
      <button id="limpar" class="botao-secundario" type="button">Limpar campos</button>
    </section>
  </main>
</body>
</html>
